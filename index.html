<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Turn Detection System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
        }
        .alert-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl mx-auto bg-gray-800 rounded-2xl shadow-2xl p-6 md:p-8 space-y-6">
        <header class="text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-cyan-400">Blind Turn Detection System</h1>
            <p class="text-gray-400 mt-2">Smart alerts for safer roads.</p>
        </header>

        <!-- User ID Display -->
        <div class="bg-gray-900 p-4 rounded-lg text-center">
            <p class="text-sm text-gray-500">Your User ID:</p>
            <p id="userId" class="font-mono text-lg text-amber-400 break-all">Initializing...</p>
        </div>

        <!-- Status Indicator -->
        <div id="status-box" class="flex flex-col items-center justify-center p-8 md:p-12 rounded-xl transition-all duration-500 bg-green-500/10 border border-green-500">
             <svg id="status-icon-safe" xmlns="http://www.w.org/2000/svg" class="h-16 w-16 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
             <svg id="status-icon-alert" xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-red-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <p id="status-text" class="text-2xl md:text-3xl font-bold mt-4 text-green-300">ALL CLEAR</p>
            <p id="status-description" class="text-sm text-gray-400 mt-1 text-center">No opposing vehicles detected.</p>
        </div>

        <!-- Testing Controls -->
        <div class="bg-gray-900/50 p-4 rounded-lg space-y-4 border border-gray-700">
            <div class="flex items-center">
                <input type="checkbox" id="testModeCheckbox" class="h-4 w-4 rounded bg-gray-700 border-gray-600 text-cyan-500 focus:ring-cyan-600">
                <label for="testModeCheckbox" class="ml-3 text-sm font-medium text-gray-300">Enable Testing Mode</label>
            </div>
            <div id="testCoordsContainer" class="hidden space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="number" id="testLatitude" placeholder="Latitude" step="0.00001" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5">
                    <input type="number" id="testLongitude" placeholder="Longitude" step="0.00001" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5">
                    <input type="number" id="testHeading" placeholder="Heading (0-360)" min="0" max="360" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5">
                </div>
                <button id="updateTestLocationBtn" class="w-full text-white bg-cyan-600 hover:bg-cyan-700 focus:ring-4 focus:outline-none focus:ring-cyan-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center">Update Test Location</button>
            </div>
        </div>

        <!-- Debug Information -->
        <div class="bg-gray-900 p-4 rounded-lg text-sm space-y-2">
            <h3 class="font-semibold text-cyan-500 text-center">Your GPS Data</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-center">
                <div>
                    <p class="text-gray-500">Latitude</p>
                    <p id="latitude" class="font-mono text-gray-300">-</p>
                </div>
                <div>
                    <p class="text-gray-500">Longitude</p>
                    <p id="longitude" class="font-mono text-gray-300">-</p>
                </div>
                 <div>
                    <p class="text-gray-500">Heading</p>
                    <p id="heading" class="font-mono text-gray-300">-</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // --- CONFIGURATION ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                    apiKey: "AIzaSyAuGWKx41qRsHQVapW0BGCKE5cvDb7t5XA",
                    authDomain: "blind-turn-detection.firebaseapp.com",
                    projectId: "blind-turn-detection",
                    storageBucket: "blind-turn-detection.firebasestorage.app",
                    messagingSenderId: "957346911990",
                    appId: "1:957346911990:web:854d38d1238fd4023bbed7",
                    measurementId: "G-98K30FM21T"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'blind-turn-app-default';

        // PRE-DEFINED BLIND TURN DATA
        // Location: turn near Jamdoli,Rajasthan
        const BLIND_TURN = {
            name: "Beermalpura Turn",
            coords: { lat: 26.93410, lng: 75.92393 },
        };

        // Alert Distance
        const PEER_ALERT_DISTANCE = 10; // meters
        const TURN_ALERT_DISTANCE = 20; // meters
        const OPPOSITE_DIRECTION_THRESHOLD_MIN = 120; // degrees
        const OPPOSITE_DIRECTION_THRESHOLD_MAX = 240; // degrees

        // --- UI ELEMENTS ---
        const statusBox = document.getElementById('status-box');
        const statusText = document.getElementById('status-text');
        const statusDescription = document.getElementById('status-description');
        const statusIconSafe = document.getElementById('status-icon-safe');
        const statusIconAlert = document.getElementById('status-icon-alert');
        const userIdEl = document.getElementById('userId');
        const latitudeEl = document.getElementById('latitude');
        const longitudeEl = document.getElementById('longitude');
        const headingEl = document.getElementById('heading');
        const testModeCheckbox = document.getElementById('testModeCheckbox');
        const testCoordsContainer = document.getElementById('testCoordsContainer');
        const testLatitude = document.getElementById('testLatitude');
        const testLongitude = document.getElementById('testLongitude');
        const testHeading = document.getElementById('testHeading');
        const updateTestLocationBtn = document.getElementById('updateTestLocationBtn');

        // --- FIREBASE & APP STATE ---
        let app, auth, db, userId;
        let localVehiclesCache = {};
        let gpsWatchId = null;

        // --- INITIALIZATION ---
        async function initializeFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getDatabase(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                userId = auth.currentUser.uid;
                userIdEl.textContent = userId;

                const userDbRef = ref(db, `/artifacts/${appId}/public/data/vehicles/${userId}`);
                onDisconnect(userDbRef).remove();

                setupEventListeners();
                startGpsTracking();
                listenForVehicleUpdates();
            } catch (error) {
                console.error("Firebase Initialization Error:", error);
                statusText.textContent = "Connection Error";
            }
        }

        // --- EVENT LISTENERS ---
        function setupEventListeners() {
            testModeCheckbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    stopGpsTracking();
                    testCoordsContainer.classList.remove('hidden');
                    latitudeEl.textContent = 'TESTING';
                    longitudeEl.textContent = 'TESTING';
                    headingEl.textContent = 'TESTING';
                } else {
                    startGpsTracking();
                    testCoordsContainer.classList.add('hidden');
                }
            });

            updateTestLocationBtn.addEventListener('click', () => {
                const lat = parseFloat(testLatitude.value);
                const lng = parseFloat(testLongitude.value);
                const head = parseFloat(testHeading.value);
                if (!isNaN(lat) && !isNaN(lng) && !isNaN(head)) {
                    const mockPosition = { coords: { latitude: lat, longitude: lng, heading: head } };
                    updateLocation(mockPosition);
                } else {
                    alert('Please enter valid coordinates and heading.');
                }
            });
        }

        // --- GPS & LOCATION LOGIC ---
        function startGpsTracking() {
            if (gpsWatchId !== null) return;
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }
            gpsWatchId = navigator.geolocation.watchPosition(updateLocation, handleLocationError, {
                enableHighAccuracy: true,
            });
        }

        function stopGpsTracking() {
            if (gpsWatchId !== null) {
                navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null;
            }
        }

        async function updateLocation(position) {
            const { latitude, longitude, heading } = position.coords;
            latitudeEl.textContent = latitude.toFixed(5);
            longitudeEl.textContent = longitude.toFixed(5);
            headingEl.textContent = heading !== null ? Math.round(heading) + '°' : 'N/A';

            const userDbRef = ref(db, `/artifacts/${appId}/public/data/vehicles/${userId}`);
            try {
                await set(userDbRef, {
                    lat: latitude,
                    lng: longitude,
                    heading: heading,
                    timestamp: serverTimestamp()
                });
            } catch (error) {
                console.error("Error updating location in Firebase:", error);
            }
        }

        function handleLocationError(error) {
            console.warn(`ERROR(${error.code}): ${error.message}`);
            statusText.textContent = "GPS Error";
        }

        // --- REAL-TIME DATABASE LISTENER ---
        function listenForVehicleUpdates() {
            const vehiclesRef = ref(db, `/artifacts/${appId}/public/data/vehicles`);
            onValue(vehiclesRef, (snapshot) => {
                localVehiclesCache = snapshot.val() || {};
                checkBlindTurnProximity();
            });
        }

        // CORE DETECTION LOGIC
        function checkBlindTurnProximity() {
            const currentUser = localVehiclesCache[userId];
            if (!currentUser) return;

            const distToTurnCurrentUser = haversineDistance(currentUser, BLIND_TURN.coords);

            // Only check for threats if the current user is near the turn
            if (distToTurnCurrentUser >= TURN_ALERT_DISTANCE) {
                clearAlert();
                return;
            }

            let closestThreat = null;
            let minPeerDist = Infinity;

            for (const otherVehicleId in localVehiclesCache) {
                if (otherVehicleId === userId) continue;
                
                const otherVehicle = localVehiclesCache[otherVehicleId];
                if (!otherVehicle || typeof otherVehicle.lat !== 'number' || typeof otherVehicle.lng !== 'number' || typeof otherVehicle.heading !== 'number') continue;
                if (typeof currentUser.heading !== 'number') continue;

                const peerDist = haversineDistance(currentUser, otherVehicle);

                if (peerDist < PEER_ALERT_DISTANCE) {
                    const headingDifference = Math.abs(currentUser.heading - otherVehicle.heading);
                    
                    if (headingDifference > OPPOSITE_DIRECTION_THRESHOLD_MIN && headingDifference < OPPOSITE_DIRECTION_THRESHOLD_MAX) {
                       // This vehicle is a threat. Check if it's the closest one found so far.
                       if (peerDist < minPeerDist) {
                           minPeerDist = peerDist;
                           closestThreat = otherVehicle;
                       }
                    }
                }
            }

            if (closestThreat) {
                const distToTurnThreat = haversineDistance(closestThreat, BLIND_TURN.coords);
                if (distToTurnCurrentUser <= distToTurnThreat) {
                    triggerAlert('slow', distToTurnCurrentUser);
                } else {
                    triggerAlert('stop', distToTurnCurrentUser);
                }
            } else {
                clearAlert();
            }
        }
        
        // --- UI ALERT FUNCTIONS ---
        function triggerAlert(type, distance) {
            statusBox.classList.remove('bg-green-500/10', 'border-green-500');
            statusBox.classList.add('bg-red-500/20', 'border-red-500', 'alert-pulse');
            statusIconSafe.classList.add('hidden');
            statusIconAlert.classList.remove('hidden');
            statusText.classList.remove('text-green-300');
            statusText.classList.add('text-red-300');

            if (type === 'slow') {
                 statusText.textContent = "SLOW DOWN!";
                 statusDescription.textContent = `Closest threat detected! You are closer (${distance.toFixed(1)}m away).`;
            } else if (type === 'stop') {
                statusText.textContent = "STOP VEHICLE!";
                statusDescription.textContent = `Closest threat detected! You are further (${distance.toFixed(1)}m away).`;
            }
        }

        function clearAlert() {
            statusBox.classList.add('bg-green-500/10', 'border-green-500');
            statusBox.classList.remove('bg-red-500/20', 'border-red-500', 'alert-pulse');
            statusIconSafe.classList.remove('hidden');
            statusIconAlert.classList.add('hidden');
            statusText.textContent = "ALL CLEAR";
            statusText.classList.add('text-green-300');
            statusText.classList.remove('text-red-300');
            statusDescription.textContent = "No opposing vehicles detected.";
        }

        // UTILITY: HAVERSINE DISTANCE FUNCTION
        function haversineDistance(coords1, coords2) {
            const R = 6371e3; // metres
            const φ1 = coords1.lat * Math.PI / 180;
            const φ2 = coords2.lat * Math.PI / 180;
            const Δφ = (coords2.lat - coords1.lat) * Math.PI / 180;
            const Δλ = (coords2.lng - coords1.lng) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // in metres
        }

        // --- START THE APP ---
        initializeFirebase();

    </script>
</body>
</html>
